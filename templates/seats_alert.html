<!doctype html>
<html lang="en">
  <head>

      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#111111;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background:#FFD500;padding:24px 32px;">
                <h1 style="margin:0;color:#0a0a0a;font-size:24px;">Seats on resale</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;color:#f5f5f5;">
                <p style="margin:0 0 16px;font-size:16px;line-height:1.5;">New seats are on resale for <strong>Stade Rochelais vs {{opponent}}</strong> ({{date}}).</p>
                <p style="margin:0;font-size:16px;line-height:1.5;">New seats: {{seats}}.</p>

            </tr>
          </table>
        </td>
      </tr>
    </table>
