name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (from the latest tag)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: 'Explicit version override (e.g. 0.2.0) — takes precedence over bump'
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Tag, release & trigger CI + deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${OVERRIDE}" ]; then
            version="${OVERRIDE#v}"
          else
            latest="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
            IFS='.' read -r major minor patch <<< "${latest#v}"
            case "${BUMP}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unknown bump type '${BUMP}'"; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
          fi

          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists"
            exit 1
          fi

          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "${cargo_version}" != "${version}" ]; then
            echo "::warning::Cargo.toml version (${cargo_version}) differs from the tag version (${version})"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi

      - name: Trigger CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run ci.yml --ref "${TAG}"

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run deploy.yml --ref "${TAG}"
