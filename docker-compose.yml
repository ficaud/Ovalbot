services:
  ovalbot:
    image: ghcr.io/ficaud/ovalbot:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: sqlite:///data/ovalbot.sqlite
    volumes:
      - ovalbot-data:/data
    restart: unless-stopped

volumes:
  ovalbot-data:
