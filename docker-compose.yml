services:
  ovalbot:
    image: ghcr.io/ficaud/ovalbot:${OVALBOT_VERSION:-latest}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: sqlite:///data/ovalbot.sqlite
      RESEND_ENABLED: ${RESEND_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-OvalBot <onboarding@resend.dev>}
      TEMPLATE_DIR: ${TEMPLATE_DIR:-/app/templates}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Ticket resale scanner (bot). Off by default; see .env.example.
      BOT_ENABLED: ${BOT_ENABLED:-false}
      BOT_SCAN_INTERVAL_SECS: ${BOT_SCAN_INTERVAL_SECS:-60}
      BOT_HOME_REFRESH_SECS: ${BOT_HOME_REFRESH_SECS:-60}
      PROXY_ENABLED: ${PROXY_ENABLED:-false}
      PROXIES_FILE: ${PROXIES_FILE:-}
    volumes:
      - ./data:/data
      # To override the email templates without rebuilding the image, create a
      # `templates/` folder next to this file (welcome.html + match_alert.html)
      # and uncomment:
      # - ./templates:/app/templates
    restart: unless-stopped
